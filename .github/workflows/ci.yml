# Continuous integration: type check, tests, build and dependency security checks.
#
# NOT ACTIVE. As written, this workflow runs only when someone starts it by hand from the
# repository's Actions tab ("Run workflow"). To switch it on, uncomment the pull_request, push
# and schedule triggers below.
name: CI

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main, develop]
  # push:
  #   branches: [main, develop]
  # schedule:
  #   # Sundays, 19:17 UTC. New advisories arrive without a change to this repository.
  #   - cron: '17 19 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency advisories and registry signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:security
