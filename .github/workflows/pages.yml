# Publishes the demo to GitHub Pages, at https://14pete99.github.io/victorian-hex-map/.
#
# Runs only when someone starts it by hand, from the repository's Actions tab ("Run workflow") or
# with `gh workflow run pages.yml`. A push does not publish anything.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A deployment in progress is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Type check, test and build the demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access: it publishes the built site and nothing else.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
