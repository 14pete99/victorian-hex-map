name: Bug report
description: Something in the map or the demo does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this.

        For a wrong election result or party holding, use the **Data correction** form instead. For a security problem, follow the security policy rather than opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo
        2. Zoom in to 130%
        3. Drag the map
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - The demo in this repository
        - The map copied into my own project
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: React and bundler versions
      description: Only needed if the map is in your own project.
      placeholder: React 19.3, Vite 8.3
